name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'public/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Sync Capacitor iOS Assets
        run: |
          npx cap sync ios

      - name: Build and Package IPA (Ad-Hoc / Sideloading)
        run: |
          cd ios/App
          # Clean and build unsigned .app bundle
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Package .app into .ipa for TrollStore / Sideloadly / AltStore
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r iFlow_IPTV.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iFlow_IPTV_iOS_IPA
          path: ios/App/iFlow_IPTV.ipa
